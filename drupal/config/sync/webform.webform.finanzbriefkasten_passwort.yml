id: finanzbriefkasten_passwort
title: Finanzbriefkasten_Passwort
description: ''
categories: {  }
elements: |-
  passwort:
    '#type': textfield
    '#title': Passwort
    '#input_hide': true
    '#states':
      disabled:
        ':input[name="nachname"]':
          filled: true
  1:
    '#type': webform_message
    '#states':
      invisible:
        ':input[name="passwort"]':
          '!value': Zulu
    '#message_type': info
    '#message_message': |
      <p><strong>Zahlungsbelege einreichen - so geht es:</strong></p>
      Mit dem Formular unten kannst Du deine Zahlungsbelege einreichen.<br />
      Fragen? Melde Dich bei L&ouml;i oder dem/der zust&auml;ndigen AL :)<br />
      &nbsp;
      
  vorname:
    '#type': textfield
    '#title': Vorname
    '#placeholder': George
    '#states':
      required:
        '':
          '': ''
  nachname:
    '#type': textfield
    '#title': Nachname
    '#placeholder': Williams
    '#states':
      invisible:
        ':input[name="passwort"]':
          '!value': Zulu
      required:
        '':
          '': ''
  file:
    '#type': webform_document_file
    '#title': 'Beleg (pdf)'
    '#description': '(Beleg kann ein PDF oder ein gutes Foto sein)'
    '#states':
      invisible:
        ':input[name="passwort"]':
          '!value': Zulu
    '#uri_scheme': public
    '#file_help': help
    '#file_extensions': pdf
    '#file_name': Beleg_Finanzbriefkasten_
  beleg_foto_:
    '#type': webform_image_file
    '#title': 'Beleg (Foto)'
    '#multiple': 3
    '#description': '(Beleg kann ein PDF oder ein gutes Foto sein)'
    '#states':
      invisible:
        ':input[name="passwort"]':
          '!value': Zulu
    '#uri_scheme': public
    '#file_help': help
    '#file_extensions': 'jpg png'
    '#file_name': Finanzbriefkasten_Beleg_Foto
  bemerkungen:
    '#type': textfield
    '#title': Bemerkungen
    '#placeholder': Blabla
    '#states':
      invisible:
        ':input[name="passwort"]':
          '!value': Zulu
      required:
        '':
          '': ''
  betrag:
    '#type': number
    '#title': Betrag
    '#size': '4'
    '#placeholder': '18.44'
    '#states':
      invisible:
        ':input[name="passwort"]':
          '!value': Zulu
      required:
        '':
          '': ''
  belegdatum:
    '#type': date
    '#title': Belegdatum
    '#placeholder': 06/06/1844
    '#states':
      required:
        '':
          '': ''
      invisible:
        ':input[name="passwort"]':
          '!value': Zulu
    '#datepicker': true
    '#date_date_format': m/d/Y
  budget:
    '#type': select
    '#title': Budget
    '#options':
      Fröschli: Fröschli
      Tipy: Tipy
      Sarasani: Sarasani
      PfiLa: PfiLa
      SoLa: SoLa
      'Events mit Tn': 'Events mit Tn'
      Kurse: Kurse
      Cevi-Shop: Cevi-Shop
      MAEL: MAEL
      'Input & Musik': 'Input & Musik'
      'Film & Foto': 'Film & Foto'
      Material: Material
      Team: Team
      Verein: Verein
    '#states':
      required:
        '':
          '': ''
      invisible:
        ':input[name="passwort"]':
          '!value': Zulu
  zahlungsart:
    '#type': select
    '#title': Zahlungsart
    '#options':
      'offene Rechnung; noch zu zahlen': 'offene Rechnung; noch zu zahlen'
      'MasterCard Cevi Alltag': 'MasterCard Cevi Alltag'
      'MasterCard Cevi Lager': 'MasterCard Cevi Lager'
      'Rückerstattung an mich': 'Rückerstattung an mich'
    '#states':
      invisible:
        ':input[name="passwort"]':
          '!value': Zulu
      required:
        '':
          '': ''
  empfaengername:
    '#type': textfield
    '#title': Empfängername
    '#placeholder': Hajk
    '#required': true
    '#states':
      visible:
        ':input[name="zahlungsart"]':
          value: 'offene Rechnung; noch zu zahlen'
  plz_ort:
    '#type': textfield
    '#title': 'PLZ & Ort'
    '#placeholder': '3612 Steffisburg'
    '#required': true
    '#states':
      visible:
        - ':input[name="zahlungsart"]':
            value: 'offene Rechnung; noch zu zahlen'
        - xor
        - ':input[name="zahlungsart"]':
            value: 'Rückerstattung an mich'
  zahlungsfrist:
    '#type': date
    '#title': Zahlungsfrist
    '#placeholder': 06/06/1844
    '#required': true
    '#states':
      visible:
        ':input[name="zahlungsart"]':
          value: 'offene Rechnung; noch zu zahlen'
    '#datepicker': true
    '#date_date_format': m/d/Y
  referenz_nr_mitteilung:
    '#type': textfield
    '#title': 'Referenz-Nr / Mitteilung'
    '#placeholder': 'Referenz-Nr / Mitteilung'
    '#required': true
    '#states':
      visible:
        ':input[name="zahlungsart"]':
          value: 'offene Rechnung; noch zu zahlen'
  iban_nr_konto_nr:
    '#type': textfield
    '#title': 'IBAN-Nr. / Konto-Nr.'
    '#minlength': 11
    '#maxlength': 21
    '#placeholder': 'CHXX XXXX XXXX XXXX XXXX X / XX-XXXXXX-X'
    '#required': true
    '#unique': true
    '#states':
      visible:
        - ':input[name="zahlungsart"]':
            value: 'offene Rechnung; noch zu zahlen'
        - xor
        - ':input[name="zahlungsart"]':
            value: 'Rückerstattung an mich'
  mail_falls_kopie_gewuenscht_:
    '#type': email
    '#title': 'Mail (falls Kopie gewünscht)'
    '#help': 'Gib Deine Mail ein und Du erh&auml;lst die Formulardaten per Mail.'
    '#placeholder': george.williams@cevisteffisburg.ch
    '#required': true
    '#states':
      invisible:
        ':input[name="passwort"]':
          '!value': Zulu
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
    '#states':
      invisible:
        ':input[name="passwort"]':
          '!value': Zulu
    '#submit__label': Abschicken
  2:
    '#type': webform_message
    '#states':
      invisible:
        ':input[name="passwort"]':
          '!value': Zulu
    '#message_type': info
    '#message_message': 'May 2022, V3.4, Created by Knoxli, adapted to&nbsp;this website by Zulu'
